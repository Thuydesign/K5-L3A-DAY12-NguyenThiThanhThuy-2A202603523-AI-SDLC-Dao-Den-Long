<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101327"><link rel="icon" href="data:,"><title>Đảo Đèn Lồng</title><link rel="stylesheet" href="src/style.css"></head>
<body><main class="shell">
<header class="mast"><div class="brand"><span class="brand-mark">✦</span><div><small>CUỘC PHIÊU LƯU CỦA MÂY</small><h1>Đảo Đèn Lồng</h1></div></div><div id="hud" class="hud hidden"><div class="hud-block flames"><small>NGỌN LỬA</small><strong id="flames">🔥 🔥 🔥</strong></div><div class="hud-block clock-wrap"><small id="night-name">ĐÊM 1</small><strong id="clock">05:00</strong><span id="wind-warning"></span></div><div class="hud-block score"><small>ĐÈN <b id="lit">0/5</b></small><strong id="score">0</strong></div></div></header>
<section id="stage" class="stage"><canvas id="game" aria-label="Đảo Đèn Lồng — trò chơi"></canvas>
<div id="firefly-meter" class="firefly-meter hidden" aria-label="Đom đóm đang mang"></div>
<div id="ability-meter" class="ability-meter hidden"><span id="dash-meter">↯ LƯỚT</span><span id="pulse-meter">✧ TỎA SÁNG</span></div>
<div id="prompt" class="prompt hidden"></div>
<div id="overlay" class="overlay"></div>
<div class="controls">WASD / ↑↓←→ đi <i>·</i> Space nhảy <i>·</i> Shift lướt <i>·</i> E nạp đèn <i>·</i> Q tỏa sáng <i>·</i> Esc tạm dừng</div>
</section><footer><span>ĐẢO BẾN · 3 ĐÊM · 60 TICK/GIÂY</span><span id="settings-summary">Âm thanh bật khi bắt đầu</span></footer>
</main><script type="module" src="src/ui.js"></script></body></html>
